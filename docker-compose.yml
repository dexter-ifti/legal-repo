services:
  db:
    image: postgres:16-alpine
    container_name: legal_saas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_saas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legal_saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: legal_saas_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/legal_saas_dev?sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@db:5432/legal_saas_dev?sslmode=disable
      CORS_ORIGIN: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_BUCKET: legal-documents-dev
      SESSION_SECRET: dev-secret-key-change-in-production
    volumes:
      - backend_storage:/app/.storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    container_name: legal_saas_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
