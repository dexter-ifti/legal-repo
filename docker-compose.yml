services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: legal_saas_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-supabase}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-legal-documents}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SESSION_SECRET: ${SESSION_SECRET:-production-secret-key-must-be-random}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - backend_storage:/app/.storage
    env_file:
      - ./Backend/.env

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: legal_saas_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: legal_saas_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  backend_storage:
