services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: legal_saas_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
    volumes:
      - backend_storage:/app/.storage
    env_file:
      - ./Backend/.env
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.legal-api.rule=Host(`legal.ifti.engineer`) && PathPrefix(`/api`)
      - traefik.http.routers.legal-api.entrypoints=websecure
      - traefik.http.routers.legal-api.tls=true
      - traefik.http.routers.legal-api.tls.certresolver=mytlschallenge
      - traefik.http.services.legal-api.loadbalancer.server.port=5000

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: legal_saas_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      - backend
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.legal-frontend.rule=Host(`legal.ifti.engineer`)
      - traefik.http.routers.legal-frontend.entrypoints=websecure
      - traefik.http.routers.legal-frontend.tls=true
      - traefik.http.routers.legal-frontend.tls.certresolver=mytlschallenge
      - traefik.http.services.legal-frontend.loadbalancer.server.port=3000

networks:
  proxy:
    external: true

volumes:
  backend_storage: